services:
  postgres:
    image: postgres:14
    env_file:
      - .docker.env
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .docker.env
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: